name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:smoke
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Inputs for the golden snapshots are generated by Office libraries (tests/real-check/requirements.txt).
      - run: pip install -r tests/real-check/requirements.txt
      - run: npm run test:golden
      - run: npx playwright install --with-deps chromium
      # Builds the site, serves it and runs the e2e test against the built files.
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
